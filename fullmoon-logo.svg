<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
<title id="title">Fullmoon Hospitality</title>
<desc id="desc">Fullmoon Hospitality official multicolour pixel logo</desc>
<rect width="900" height="220" fill="#fffdf8"/>
<!-- Clean FH pixel mark: solid square tiles, no rounding, shadows or decorative effects -->
<g transform="translate(28 38)" shape-rendering="crispEdges">
  <!-- F / first character -->
  <rect x="0" y="0" width="28" height="28" fill="#ed4770"/>
  <rect x="34" y="0" width="28" height="28" fill="#f36b45"/>
  <rect x="68" y="0" width="28" height="28" fill="#f5a623"/>
  <rect x="102" y="0" width="28" height="28" fill="#f7c62f"/>
  <rect x="0" y="34" width="28" height="28" fill="#9a58a6"/>
  <rect x="0" y="68" width="28" height="28" fill="#38b99d"/>
  <rect x="34" y="68" width="28" height="28" fill="#22b7c6"/>
  <rect x="68" y="68" width="28" height="28" fill="#7c55a7"/>
  <rect x="0" y="102" width="28" height="28" fill="#ed3e42"/>
  <rect x="0" y="136" width="28" height="28" fill="#7c55a7"/>
  <!-- H character -->
  <rect x="102" y="34" width="28" height="28" fill="#ef7a36"/>
  <rect x="102" y="68" width="28" height="28" fill="#3dbb9d"/>
  <rect x="136" y="68" width="28" height="28" fill="#22b7c6"/>
  <rect x="170" y="68" width="28" height="28" fill="#ed4770"/>
  <rect x="204" y="68" width="28" height="28" fill="#f7c62f"/>
  <rect x="102" y="102" width="28" height="28" fill="#21b4c3"/>
  <rect x="136" y="102" width="28" height="28" fill="#38b99d"/>
  <rect x="170" y="102" width="28" height="28" fill="#ed4770"/>
  <rect x="204" y="102" width="28" height="28" fill="#7c55a7"/>
  <rect x="102" y="136" width="28" height="28" fill="#e5a72d"/>
  <rect x="204" y="136" width="28" height="28" fill="#8b5ca7"/>
</g>
<line x1="310" y1="36" x2="310" y2="184" stroke="#c9c8c1" stroke-width="2"/>
<text x="350" y="104" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" letter-spacing="1" fill="#111820">FULLMOON</text>
<text x="351" y="158" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="300" letter-spacing="2" fill="#111820">HOSPITALITY</text>
</svg>