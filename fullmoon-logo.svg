  <rect x="0" y="24" width="20" height="20" fill="#9a58a6"/>
  <rect x="0" y="48" width="20" height="20" fill="#38b99d"/>
  <rect x="24" y="48" width="20" height="20" fill="#22b7c6"/>
  <rect x="48" y="48" width="20" height="20" fill="#7c55a7"/>
  <rect x="0" y="72" width="20" height="20" fill="#ed3e42"/>
  <rect x="0" y="96" width="20" height="14" fill="#7c55a7"/>

  <!-- H -->
  <rect x="112" y="0" width="20" height="20" fill="#f5a623"/>
  <rect x="112" y="24" width="20" height="20" fill="#ef7a36"/>
  <rect x="112" y="48" width="20" height="20" fill="#22b7c6"/>
  <rect x="136" y="48" width="20" height="20" fill="#38b99d"/>
  <rect x="160" y="48" width="20" height="20" fill="#ed4770"/>
  <rect x="184" y="48" width="20" height="20" fill="#f7c62f"/>
  <rect x="204" y="0" width="20" height="20" fill="#f5a623"/>
  <rect x="204" y="24" width="20" height="20" fill="#9a58a6"/>
  <rect x="204" y="48" width="20" height="20" fill="#38b99d"/>
  <rect x="204" y="72" width="20" height="20" fill="#7c55a7"/>
  <rect x="112" y="72" width="20" height="20" fill="#22b7c6"/>
  <rect x="112" y="96" width="20" height="14" fill="#e5a72d"/>
</g>
<line x1="245" y1="10" x2="245" y2="100" stroke="#c9c8c1" stroke-width="1" shape-rendering="crispEdges"/>
<text x="265" y="55" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" letter-spacing="0.4" fill="#111820">FULLMOON</text>
<text x="266" y="81" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" letter-spacing="0.7" fill="#111820">HOSPITALITY</text>
