<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 110" role="img" aria-labelledby="title desc">
<title id="title">Fullmoon Hospitality</title>
<desc id="desc">Fullmoon Hospitality multicolour pixel logo</desc>
<!-- Deliberately built on an integer pixel grid. No filters, blur, rounding or effects. -->
<g shape-rendering="crispEdges">
